name: Create Folder

on:
  workflow_dispatch:
    inputs:
      folder_names:
        description: '作成するフォルダ名（カンマ区切りで複数指定可、例: build/CMakeLists,src/utils）'
        required: true
        default: 'memo'

jobs:
  create-folder:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create folders
        run: |
          IFS=',' read -ra FOLDERS <<< "${{ github.event.inputs.folder_names }}"
          for folder in "${FOLDERS[@]}"; do
            trimmed=$(echo "$folder" | xargs)
            mkdir -p "$trimmed"
            touch "$trimmed/.gitkeep"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add folders: ${{ github.event.inputs.folder_names }}" || echo "No changes to commit"
          git push
